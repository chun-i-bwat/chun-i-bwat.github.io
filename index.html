<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>천이봤 한 번에 털기</title>
    <meta
      name="description"
      content="천이봤 두개재~!"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/chunyang-character-v1.png"
      type="image/png"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=neutral-panel-20260810" />
    <script src="./assets/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-live="polite">
        <div class="visual">
          <img
            src="./assets/chunyang-character-v1.png"
            alt="천양 캐릭터"
            width="720"
            height="720"
            decoding="async"
          />
        </div>

        <header class="header">
          <p class="eyebrow">천이봤 모아보기</p>
          <h1>천이봤 한 번에 털기</h1>
          <p class="description">
            천이봤 두개재~!
          </p>
        </header>

        <div id="status" class="status" hidden>
          <span class="status-mark" aria-hidden="true"><i></i></span>
          <div class="status-copy">
            <strong id="status-title">게시글 열기를 요청했습니다.</strong>
            <span id="status-detail">
              탭이 보이지 않으면 이 사이트의 팝업 허용 상태를 확인해 주세요.
            </span>
            <div
              id="progress"
              class="progress"
              role="progressbar"
              aria-label="게시글 열기 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span id="progress-bar"></span>
            </div>
          </div>
        </div>

        <div id="actions" class="actions" hidden>
          <button id="retry" class="retry" type="button">전체 다시 열기</button>
          <span id="count" class="count"></span>
        </div>

        <ol id="links" class="links" hidden></ol>

        <p id="empty" class="empty" hidden>
          열 게시글 정보가 없습니다. 카페 글에 있는 전체 열기 링크로 다시
          접속해 주세요.
        </p>
      </section>
    </main>
  </body>
</html>
